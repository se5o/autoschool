<!doctype html>
<html lang="sk"><head><meta charset="utf-8"><title>Teória vodiča</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a5ab5"><meta name="description" content="Interaktívne štúdium a cvičné testy na vodičský preukaz skupiny B podľa slovenských pravidiel."><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#141a24;--mu:#637083;--ac:#0a5ab5;--ac2:#2f86e8;--ok:#1a9a52;--bad:#d23a3a;--bd:#e1e6ee;--sh:0 6px 24px rgba(20,40,80,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1118;--card:#171d27;--tx:#eef2f8;--mu:#9aa6b8;--ac:#4f9bff;--ac2:#7cb5ff;--ok:#4cc27d;--bad:#ff6b6b;--bd:#262e3b;--sh:0 6px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;scroll-behavior:smooth}
body{padding-bottom:84px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:12px 18px;font-weight:800;font-size:18px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;justify-content:space-between;align-items:center}
#tm{font-variant-numeric:tabular-nums;color:var(--ac)}
main{max-width:820px;margin:0 auto;padding:6px 14px 20px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:space-around;background:#0b1d3a;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.25)}
nav button{flex:1;background:none;border:0;color:rgba(255,255,255,.55);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:14px;transition:color .25s,background .25s,transform .25s;cursor:pointer}
nav button svg{width:23px;height:23px;display:block;color:#fff;opacity:.78;transition:transform .3s cubic-bezier(.3,1.6,.5,1),opacity .2s}
nav button.on svg{opacity:1}nav button{color:rgba(255,255,255,.68)}nav button.on{color:#fff}
nav button.on{color:#fff;background:rgba(255,255,255,.14)}nav button.on svg{transform:translateY(-1px) scale(1.12)}
.v>.c{animation:up .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*50ms)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pop{50%{transform:scale(1.03)}}
.c{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
.hero .mu{color:#e3efff}.hero .big{font-size:56px;line-height:1}
h2{margin:0 0 6px;font-size:20px}h3{margin:6px 0 4px;font-size:17px;line-height:1.35}
.mu{color:var(--mu);font-size:14px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer;margin:4px 6px 4px 0;transition:transform .15s,filter .2s;min-height:46px}
.btn:active{transform:scale(.96)}.btn:hover{filter:brightness(1.08)}
.btn.g{background:var(--card);color:var(--ac);border:1.5px solid var(--ac)}.btn.w{background:#fff;color:var(--ac)}
.btn.f{width:100%;margin:10px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sg{text-align:center;cursor:pointer;padding:12px;margin:0;transition:transform .2s}.sg:active{transform:scale(.97)}.sg svg{width:84px;height:84px}
.nm{transition:filter .3s}.blur .nm{filter:blur(8px)}.blur .sg.rev .nm{filter:none}
.nm b{font-size:14px;display:block;line-height:1.25}.nm .mu{font-size:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:7px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
input[type=search]{width:100%;font:inherit;padding:11px 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:14px;padding:14px;margin:9px 0;font:inherit;cursor:pointer;transition:transform .15s,border-color .2s,background .25s}
.opt:active{transform:scale(.98)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card));animation:pop .4s}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card));animation:shake .4s}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:6px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.tag{font-size:12px;background:color-mix(in srgb,var(--ac) 12%,var(--card));border-radius:8px;padding:2px 9px;color:var(--ac);font-weight:600}
.qs{display:flex;justify-content:center;margin:8px 0;animation:pop .5s}.qs svg{width:150px;height:150px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.15))}.qs.sc svg,.qs.by svg{width:min(100%,320px);height:auto}.hb{background:rgba(255,255,255,.28)}.hb i{background:#fff}.dt{font:inherit;border:1px solid var(--bd);border-radius:8px;padding:10px 12px;background:var(--card);color:var(--tx);width:150px;min-height:46px;font-variant-numeric:tabular-nums}
.fb{animation:up .35s both}
.ring{display:block;margin:0 auto}.ring circle{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hi{cursor:pointer;transition:transform .15s}.hi:active{transform:scale(.98)}
.badge{font-size:12px;font-weight:700;border-radius:8px;padding:3px 10px;color:#fff}.badge.p{background:var(--ok)}.badge.n{background:var(--bad)}
.ro{padding:8px 10px;border-radius:10px;margin:5px 0;font-size:15px;border:1.5px solid transparent}
.ro.ok{background:color-mix(in srgb,var(--ok) 16%,var(--card));border-color:var(--ok)}.ro.bad{background:color-mix(in srgb,var(--bad) 16%,var(--card));border-color:var(--bad)}
.rv{border-left:5px solid var(--bd)}.rv.okc{border-left-color:var(--ok)}.rv.nok{border-left-color:var(--bad)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

["O","Vozidlo sa nesmie používať v premávke, ak…",["Má závažné technické nedostatky ohrozujúce bezpečnosť, napríklad nefunkčné brzdy","Je špinavé","Nemá rádio"],0,"Bezpečnosť má prednosť."],
["O","Pneumatiky na jednej náprave musia byť…",["Rovnakého typu a rozmeru","Ľubovoľné","Rôzne"],0,"Inak sa zhoršuje stabilita."],
["K","Hladinu motorového oleja kontrolujeme…",["Mierkou na rovine pri vypnutom motore po chvíli státia","Za chodu motora","Podľa farby výfuku"],0,"Olej musí stiecť do olejovej vane."],
["K","Pretlakový uzáver chladiaceho systému otvárame…",["Až po vychladnutí motora","Hneď po jazde","Za chodu motora"],0,"Horúca kvapalina pod tlakom môže spôsobiť popáleniny."],
["K","Brzdová kvapalina…",["Pohlcuje vlhkosť, preto sa pravidelne vymieňa","Nikdy sa nevymieňa","Vymieňa sa po 20 rokoch"],0,"Vlhkosť znižuje bod varu kvapaliny."],
["K","Po dlhej záťaži vozidla s turbom je vhodné…",["Nechať motor chvíľu bežať na voľnobeh","Okamžite vypnúť","Ísť rýchlejšie"],0,"Turbo sa musí ochladiť."],
["K","Katalyzátor…",["Znižuje škodlivé látky vo výfukových plynoch","Zvyšuje výkon","Chladí motor"],0,"Je súčasťou výfukového systému."],
["K","Kód DOT na pneumatike 2223 znamená…",["22. týždeň roku 2023","22. mesiac roku 2023","Tlak 22 a 23"],0,"Posledné štyri číslice udávajú dátum výroby."],
["K","Po výmene kolesa je potrebné…",["Matice dotiahnuť krížovo a po ujdení niekoľkých desiatok km skontrolovať","Dotiahnuť raz","Nič"],0,"Matice sa môžu uvoľniť."],
["K","Filter pevných častíc (DPF) pri dieseli…",["Zachytáva sadze z výfukových plynov","Zvyšuje výkon","Chladí motor"],0,"Čistí sa pri vyššej záťaži."],
["K","ESP oproti ABS navyše…",["Stabilizuje vozidlo pri šmyku zásahom do bŕzd a motora","Znižuje spotrebu","Predlžuje brzdnú dráhu"],0,"ESP zasahuje pri strate stability."],
["K","Rozsvietená kontrolka nabíjania znamená, že…",["Alternátor nenabíja batériu","Je plná nádrž","Je nízky tlak v pneumatikách"],0,"Hrozí vybitie batérie."],
["K","Tlak v pneumatikách kontrolujeme najlepšie…",["Za studena","Hneď po dlhej jazde","Len v lete"],0,"Zohriate pneumatiky majú vyšší tlak."],
["K","Zmes do ostrekovačov v zime má byť…",["Nemrznúca","Čistá voda","Olejová"],0,"Voda by v zime zamrzla."],
["K","Nízky tlak v pneumatikách spôsobí…",["Vyššiu spotrebu, väčšie opotrebovanie a horšiu stabilitu","Nižšiu spotrebu","Nič"],0,"Pneumatika sa viac deformuje a hreje."],
["K","Červená kontrolka na prístrojovej doske zvyčajne znamená…",["Nebezpečenstvo alebo vážnu poruchu, treba zastaviť","Informáciu","Zapnuté svetlá"],0,"Oranžová je upozornenie, zelená a modrá informácia."],
 ["P","Na ceste s dvoma jazdnými pruhmi v jednom smere sa zaraďujete z pravého do ľavého pruhu. V ľavom pruhu ide vozidlo rýchlejšie. Ako postupujete?",["Zaradím sa až vtedy, keď tým vodiča v ľavom pruhu neohrozím ani neobmedzím a dám znamenie","Vodič v ľavom pruhu mi musí uvoľniť miesto","Mám prednosť, pretože dávam smerovku"],0,"Pri zmene jazdného pruhu dávate prednosť vozidlu v pruhu, do ktorého prechádzate. Smerovka vám prednosť nedáva."],
 ["P","Dva jazdné pruhy sa zbiehajú do jedného a nie je zrejmé, ktorý je priebežný. Ktorý vodič dáva prednosť?",["Vodič v ľavom pruhu vodičovi v pravom pruhu","Vodič v pravom pruhu vodičovi v ľavom pruhu","Prednosť má vozidlo, ktoré je väčšie"],0,"Pri zbiehaní pruhov bez zrejmého priebežného pruhu dáva vodič v ľavom pruhu prednosť vodičovi v pravom."],
 ["P","V hustej premávke sa vytvorili súvislé kolóny v dvoch pruhoch. Pravý pruh sa pohybuje rýchlejšie než ľavý. Ide o predchádzanie?",["Nie, pri súbežnej jazde sa rýchlejší pohyb jedného pruhu nepovažuje za predchádzanie","Áno, vždy ide o predchádzanie","Áno, ale iba mimo obce"],0,"Zákon pri súbežnej jazde výslovne odlišuje rýchlejší pohyb prúdu od predchádzania."],
 ["P","Pred vami ide vozidlo a jeho vodič dáva znamenie o odbočení vľavo. Kedy ho môžete predísť vpravo?",["Ak je to možné a bezpečné a máte na to priestor podľa pravidiel cestnej premávky","Nikdy za žiadnych okolností","Vždy, aj cez krajnicu"],0,"Vpravo možno predísť vozidlo odbočujúce vľavo, ak už nie je pochybnosť o jeho ďalšom smere a manéver je bezpečný."],
 ["P","Pri predchádzaní cyklistu na ceste s najvyššou dovolenou rýchlosťou 90 km/h musí byť bočný odstup spravidla najmenej…",["1,5 m","1 m","0,5 m"],0,"Pri rýchlostiach nad 50 km/h je spravidla potrebný bočný odstup najmenej 1,5 m."],
 ["P","Vchádzate z obytnej zóny na cestu. Komu dávate prednosť?",["Všetkým vozidlám idúcim po ceste a ostatným účastníkom, ktorým podľa situácie musíte dať prednosť","Len vozidlám prichádzajúcim zľava","Len vozidlám na hlavnej ceste"],0,"Pri vychádzaní z obytnej zóny na cestu dávate prednosť vozidlám idúcim po ceste."],
 ["P","Na križovatke máte zelený signál, ale za križovatkou je kolóna a nemali by ste kam pokračovať. Čo urobíte?",["Nevojdem do križovatky, ak by som v nej musel zostať stáť a blokovať premávku","Vojdem, pretože zelená vždy povoľuje vjazd","Vojdem a zapnem výstražné svetlá"],0,"Zelený signál neruší zákaz vojsť do križovatky, ak by ste ju zablokovali."],
 ["P","Pri jazde po diaľnici sa minie palivo a vozidlo začne strácať výkon. Čo je správny postup?",["Bezpečne sa presuniem na odstavný pruh, označím prekážku a privolám pomoc","Zastavím v ľavom pruhu","Cúvam k najbližšiemu výjazdu"],0,"Na diaľnici sa nesmie cúvať ani zastavovať v jazdnom pruhu; poruchu riešte z odstavného pruhu a bezpečne."],
 ["P","Kedy smiete použiť diaľkové svetlá?",["Ak neoslepujem protiidúcich ani vodičov predo mnou a ich použitie je vhodné","Vždy na neosvetlenej ceste, aj keď ide oproti vozidlo","Len mimo obce"],0,"Diaľkové svetlá nesmú oslňovať ostatných účastníkov premávky."],
 ["P","Vodič električky dáva znamenie o zmene smeru a križuje vašu dráhu. Ako postupujete?",["Umožním jej jazdu, ak zákonné pravidlo prednosti električky dopadá na danú situáciu","Vždy mám prednosť, pretože som v osobnom aute","Rozhoduje, kto je rýchlejší"],0,"Zákon upravuje prednosť električky pri križovaní smeru jazdy, keď dáva znamenie o zmene smeru."],
 ["R","Na križovatke rovnocenných ciest chcete odbočiť vľavo. Sprava prichádza vozidlo a oproti vám ďalšie vozidlo ide priamo. Komu dáte prednosť?",["Obom – vozidlu sprava podľa pravidla pravej ruky aj protiidúcemu vozidlu pri odbočení vľavo","Len vozidlu sprava","Len protiidúcemu vozidlu"],0,"Treba súčasne rešpektovať prednosť sprava aj povinnosť odbočujúceho vľavo dať prednosť protiidúcim."],
 ["R","Na hlavnej ceste križovatka mení jej smer. Vy idete po hlavnej a odbočujete podľa jej priebehu, protiidúce vozidlo ide z vedľajšej. Čo rozhoduje?",["Dopravné značky určujúce hlavnú a vedľajšiu cestu; vozidlá na vedľajšej dávajú prednosť","Pravidlo pravej ruky bez ohľadu na značky","Prednosť má vozidlo idúce rovno vždy"],0,"Prednosť vyplýva zo značiek hlavnej a vedľajšej cesty, nie iba zo smeru jazdy."],
 ["R","Vchádzate na kruhový objazd označený značkou Kruhový objazd, ale bez značky Daj prednosť v jazde. Čo platí?",["Samotný kruhový objazd automaticky neurčuje prednosť; rozhodujú ostatné značky a všeobecné pravidlá","Vozidlá na kruhovom objazde majú vždy prednosť","Vozidlá vchádzajúce majú vždy prednosť"],0,"Prednosť vozidiel na kruhovom objazde vyplýva z príslušnej značky Daj prednosť alebo STOP, nie zo samotného symbolu kruhového objazdu."],
 ["R","Na križovatke riadenej semaforom bliká žlté svetlo. Ako sa zachováte?",["Riadim sa značkami a všeobecnými pravidlami prednosti, zvýšim opatrnosť","Mám automaticky prednosť pred všetkými","Musím vždy zastaviť ako na STOP"],0,"Blikajúci žltý signál upozorňuje na zvýšenú opatrnosť; prednosť určujú značky a pravidlá."],
 ["R","Pri odbočovaní vpravo križujete cyklistu, ktorý ide rovno súbežne s cestou po cyklistickej infraštruktúre. Čo urobíte?",["Dám cyklistovi prednosť a odbočím až bezpečne","Odbočím, pretože cyklista je za mnou","Zatrúbim a pokračujem"],0,"Vodič odbočujúci vpravo musí dať prednosť cyklistovi idúcemu rovno vrátane súbežne idúceho cyklistu."],
 ["R","Vodič oproti vám odbočuje vľavo a vy idete priamo. Kto má prednosť?",["Spravidla ja ako protiidúce vozidlo idúce priamo","Vodič odbočujúci vľavo","Vozidlo, ktoré prvé vošlo do križovatky"],0,"Vodič odbočujúci vľavo dáva prednosť protiidúcim vozidlám idúcim priamo alebo odbočujúcim vpravo."],
 ["S","Na križovatke rovnocenných ciest vozidlo A odbočuje vľavo a vozidlo B prichádza sprava. Ktorý princíp rozhoduje?",["Vozidlo A musí rešpektovať prednosť sprava a zároveň protiidúce vozidlá pri odbočení vľavo","Vozidlo A má prednosť, pretože odbočuje ako prvé","Prednosť má vozidlo s väčším autom"],0,"Na križovatke rovnocenných ciest sa uplatňuje prednosť sprava; pri odbočení vľavo navyše dávate prednosť protiidúcim."],
 ["S","Počas jazdy sa rozsvieti červená kontrolka tlaku oleja a motor začne klepať. Čo urobíte?",["Čo najskôr bezpečne zastavím a vypnem motor; nepokračujem v jazde","Pridám plyn, aby sa tlak zvýšil","Pokračujem do najbližšej čerpacej stanice"],0,"Nízky tlak oleja môže v krátkom čase vážne poškodiť motor. Bezpečne zastavte a motor vypnite."],
 ["S","Na mokrej vozovke v zákrute začne zadná časť vozidla vybočovať. Aký je najvhodnejší prvý postup?",["Pozriem sa a jemne korigujem smer volantom, vyhnem sa prudkému brzdeniu a pohybom","Zabrzdím prudko a zatočím opačne bez ohľadu na smer šmyku","Zatiahnem parkovaciu brzdu"],0,"Pri pretáčavom šmyku treba vozidlo citlivo stabilizovať a vyhnúť sa prudkým zásahom."],
 ["S","Pri približovaní k priechodu vidíte chodca, ktorý stojí pri okraji a zjavne sa chystá vstúpiť. Ako postupujete?",["Znížim rýchlosť a umožním mu bezpečne prejsť, ak vstupuje na priechod","Zrýchlim, aby som prešiel pred ním","Zatrúbim a pokračujem bez zmeny rýchlosti"],0,"Vodič musí voči chodcom pri priechode postupovať obozretne a umožniť bezpečný prechod podľa zákonných povinností."],
 ["S","Na diaľnici sa blíži kolóna a vzniká priestor medzi pruhmi. Ako vytvoríte záchranársku uličku?",["V ľavom pruhu sa radím čo najviac doľava, v ostatných pruhoch čo najviac doprava","Všetci sa radia doprava","Ulička sa vytvára až po príchode sanitky"],0,"Záchranárska ulička sa vytvára medzi ľavým jazdným pruhom a pruhom vedľa neho."],
 ["S","Pri jazde v noci zbadáte na vozovke predmet, ktorému sa nedá bezpečne vyhnúť bez prejazdu do protismeru. Čo je správne?",["Znížim rýchlosť a podľa potreby zastavím; nevybočím nebezpečne do protismeru","Strhnem volant do protismeru bez kontroly","Zavriem oči a prejdem ponad predmet"],0,"Bezpečné zastavenie je lepšie než náhly nebezpečný manéver do protismeru."],
 ["B","Pri rýchlosti 50 km/h prejde vozidlo počas reakčného času 1 sekundy približne…",["14 metrov","5 metrov","28 metrov"],0,"50 km/h je približne 13,9 m/s, teda za sekundu prejdete asi 14 metrov ešte pred začiatkom brzdenia."],
 ["B","Pri dvojnásobnej rýchlosti sa pri rovnakých podmienkach brzdná dráha približne…",["Zväčší na štvornásobok","Zdvojnásobí","Zväčší na osemnásobok"],0,"Brzdná dráha je približne úmerná druhej mocnine rýchlosti."],
 ["B","Prečo je nebezpečné jazdiť s nesprávnym tlakom v pneumatikách?",["Mení sa priľnavosť, stabilita, opotrebenie aj brzdné vlastnosti","Ovplyvňuje iba komfort","Nemá to vplyv, ak je dezén dostatočný"],0,"Nesprávny tlak zhoršuje ovládateľnosť a môže viesť k prehriatiu alebo poškodeniu pneumatiky."],
 ["B","Čo je aquaplaning?",["Strata kontaktu pneumatiky s vozovkou na vrstve vody, pri ktorej vozidlo stráca ovládateľnosť","Zablokovanie motora pri prejazde mlákou","Zvýšenie priľnavosti na mokrej ceste"],0,"Pri aquaplaningu pneumatika nedokáže vytlačiť vodu a vozidlo sa môže stať neovládateľným."],
 ["B","Ako správne zväčšíte bezpečnostný odstup pri daždi alebo snežení?",["Výrazne ho zväčším, pretože sa predlžuje brzdná dráha a zhoršuje výhľad","Nechám rovnaký odstup ako na suchu","Skrátim ho, aby ma iní nepredbiehali"],0,"Na klzkej vozovke je potrebný väčší odstup, aby zostal priestor na reakciu a brzdenie."],
 ["B","Ktorá kombinácia najviac zvyšuje riziko únavy a mikrospánku?",["Dlhá monotónna jazda, nedostatok spánku a jazda v čase obvyklého spánku","Krátka prestávka a dostatok spánku","Vetranie kabíny a primerané prestávky"],0,"Únavu zvyšuje najmä nedostatok spánku a monotónna dlhá jazda; otvorené okno ju nevyrieši."],
 ["V","Čo sa stane s kinetickou energiou vozidla, ak sa rýchlosť zvýši z 50 na 100 km/h?",["Zvýši sa približne štvornásobne","Zdvojnásobí sa","Zvýši sa o polovicu"],0,"Kinetická energia rastie so štvorcom rýchlosti."],
 ["V","Pri brzdení s ABS na klzkej vozovke cítite pulzovanie pedála. Čo urobíte?",["Držím brzdový pedál pevne stlačený a sústredím sa na riadenie smeru","Opakovane pumpujem pedál","Okamžite uvoľním brzdu"],0,"Pulzovanie je bežný prejav činnosti ABS; pedál nepumpujte."],
 ["V","Prečo sa na dlhom klesaní nemá jazdiť na neutráli?",["Strácate účinok brzdenia motorom a viac zaťažujete prevádzkové brzdy","Znižuje sa hlučnosť motora","Zvyšuje sa priľnavosť pneumatík"],0,"Zvolený nižší prevodový stupeň pomáha brzdiť motorom a predchádzať prehriatiu bŕzd."],
 ["V","Čo najviac ovplyvňuje dĺžku brzdnej dráhy?",["Rýchlosť, stav pneumatík a bŕzd, priľnavosť a sklon vozovky","Len objem motora","Len počet cestujúcich"],0,"Brzdná dráha závisí od rýchlosti a podmienok priľnavosti aj technického stavu."],
 ["D","Aký je minimálny vek na udelenie vodičského oprávnenia skupiny B na Slovensku?",["17 rokov","18 rokov","21 rokov"],0,"Podľa § 78 ods. 1 písm. c) zákona č. 8/2009 Z. z. je minimálny vek pre skupinu B 17 rokov."],
 ["D","Ak bolo vodičské oprávnenie skupiny B udelené pred dovŕšením 18 rokov, za akých podmienok môže jeho držiteľ jazdiť do 18 rokov?",["Len v prítomnosti zapísanej sprevádzajúcej osoby, ktorá má skupinu B najmenej 10 rokov","Bez obmedzenia od dňa skúšky","Len na území obce"],0,"Zákon stanovuje do 18 rokov jazdu len so zapísanou sprevádzajúcou osobou s oprávnením B najmenej 10 rokov; platí aj minimálna doba sprievodu."],
 ["D","Ktoré tvrdenie o vodičskom oprávnení skupiny B vo veku 17 rokov je správne?",["Vek 17 rokov je minimálny vek na udelenie oprávnenia, nie automatické povolenie jazdiť bez sprievodu do 18 rokov","Vodič môže jazdiť sám hneď po skúške","Vodič môže jazdiť iba s inštruktorom autoškoly"],0,"Rozlišujte minimálny vek na udelenie oprávnenia a osobitné obmedzenie jazdy pred dovŕšením 18 rokov."],
 ["O","Počas jazdy sa rozsvieti kontrolka dobíjania akumulátora. Čo je najpravdepodobnejšia príčina?",["Porucha dobíjania, napríklad alternátora alebo jeho pohonu","Nízka hladina chladiacej kvapaliny","Zapnuté stretávacie svetlá"],0,"Kontrolka dobíjania signalizuje problém v nabíjacej sústave; vozidlo môže pokračovať len obmedzený čas."],
 ["O","Zistíte, že brzdový pedál sa pri stlačení prepadáva nezvyčajne hlboko. Čo urobíte?",["Nepokračujem v jazde; ide o možnú vážnu poruchu brzdovej sústavy","Doplním palivo a pokračujem","Zvýšim tlak v pneumatikách"],0,"Zmena odporu alebo prepadávanie pedála môže signalizovať poruchu bŕzd. Vozidlo nepoužívajte."],
 ["K","Prečo sa nesmie otvárať uzáver chladiacej sústavy pri horúcom motore?",["Horúca kvapalina pod tlakom môže prudko vystreknúť a spôsobiť vážne popáleniny","Kvapalina by sa zmenila na olej","Motor by sa okamžite zastavil"],0,"Sústava je pod tlakom; uzáver otvárajte až po vychladnutí podľa pokynov výrobcu."],
 ["K","Ktorú kvapalinu nikdy nedolievate do nádržky chladiacej kvapaliny namiesto predpísanej zmesi?",["Motorový olej","Vhodnú chladiacu zmes","Vodu v núdzovej situácii podľa pokynov výrobcu"],0,"Motorový olej nepatrí do chladiacej sústavy; používajte kvapalinu podľa špecifikácie výrobcu."],
 ["K","Čo znamená, ak sa kontrolka motora rozbliká a motor stratí výkon?",["Môže ísť o vážnejšiu poruchu; znížim zaťaženie a bezpečne zastavím alebo vyhľadám servis podľa prejavov","Je to vždy len pripomienka servisu","Môžem bez obmedzenia pokračovať"],0,"Blikajúca kontrolka motora môže signalizovať závažnú poruchu, napríklad vynechávanie zapaľovania; riaďte sa návodom vozidla."],
 ["K","Na čo slúži alternátor?",["Počas chodu motora vyrába elektrickú energiu a dobíja akumulátor","Chladí motorový olej","Zvyšuje tlak v brzdovej sústave"],0,"Alternátor napája elektrické spotrebiče a dobíja akumulátor pri bežiacom motore."],
 ["K","Aký je účel chladiacej kvapaliny?",["Odvádza teplo z motora a pomáha udržiavať prevádzkovú teplotu","Maže prevodovku","Zvyšuje tlak v pneumatikách"],0,"Chladiaca kvapalina prenáša teplo a chráni sústavu pred zamrznutím a koróziou podľa špecifikácie."],
 ["K","Ktoré označenie na mierke oleja určuje správne rozmedzie hladiny?",["MIN a MAX","HOT a COLD na pneumatike","DOT a ECE"],0,"Hladina oleja má byť v rozsahu určenom výrobcom medzi značkami MIN a MAX."],
 ["K","Čo môže signalizovať biely hustý dym z výfuku po zahriatí motora spolu s úbytkom chladiacej kvapaliny?",["Možný prienik chladiacej kvapaliny do spaľovacieho priestoru","Normálnu funkciu alternátora","Nízky tlak v pneumatikách"],0,"Môže ísť o vážnu poruchu, napríklad poškodené tesnenie pod hlavou; potrebná je diagnostika."],
 ["K","Prečo sa pri výmene kolesa na krajnici nespoliehate iba na zdvihák?",["Vozidlo treba zabezpečiť proti pohybu a použiť bezpečný postup na pevnom podklade","Zdvihák automaticky zablokuje všetky kolesá","Zdvihák nahrádza parkovaciu brzdu aj kliny"],0,"Vozidlo zabezpečte proti pohybu, zvoľte bezpečné miesto a postupujte podľa návodu výrobcu."],
,
 // Rozšírená náročnejšia sada – situačné otázky s vierohodnými možnosťami
 ["P","Na diaľnici sa blížite k pripájaciemu pruhu, v ktorom sa zaraďuje nákladné vozidlo. Ako postupujete, ak máte vľavo voľný pruh a zmena je bezpečná?",["Podľa možností vytvorím priestor presunutím do ľavého pruhu; vozidlo v pripájacom pruhu však musí samo dať prednosť","Zrýchlim a prejdem tesne popri ňom, pretože má povinnosť dať prednosť","Zastavím v pravom pruhu, aby sa mohlo zaradiť"],0,"Vodič v pripájacom pruhu dáva prednosť vozidlám na diaľnici. Ostatní však majú jazdiť ohľaduplne a môžu bezpečne uľahčiť zaradenie."],
 ["P","Pred vami ide vozidlo s prívesom. Chcete ho predísť, ale za horizontom nevidíte protiidúcu časť cesty. Čo platí?",["Predchádzanie nezačnem, pretože nemám dostatočný rozhľad na bezpečné dokončenie manévru","Začnem predchádzať, ak mám dostatočný výkon motora","Stačí krátko zatrúbiť a predchádzanie je dovolené"],0,"Predchádzanie je dovolené len vtedy, ak máte rozhľad a priestor na bezpečné dokončenie bez ohrozenia ostatných."],
 ["P","V obci stojí autobus na zastávke a dáva znamenie o zmene smeru jazdy, aby sa zaradil z miesta zastávky. Ako sa zachováte?",["Umožním mu v obci vyjsť zo zastávky, ak tým neohrozím ostatných účastníkov","Vždy pokračujem, pretože autobus musí čakať na úplne prázdnu cestu","Musím zastaviť bez ohľadu na situáciu"],0,"Vodič má v obci umožniť autobusu alebo trolejbusu vyjsť zo zastávky, ak dáva znamenie o zmene smeru; nesmie pritom dôjsť k ohrozeniu."],
 ["P","Na ceste je súvislá pozdĺžna čiara medzi vaším a protismerným pruhom. Pred vami ide pomalé vozidlo. Kedy ho môžete obísť prejazdom cez čiaru?",["Len ak to dopravné značenie a konkrétna situácia dovoľujú; samotná pomalá jazda vozidla výnimku nevytvára","Vždy, ak protiidúce vozidlo nevidno","Ak zapnete výstražné svetlá"],0,"Súvislú čiaru nemožno prechádzať, ak to značenie zakazuje; pomalé vozidlo samo osebe nie je dôvodom na porušenie značenia."],
 ["P","Pri odbočovaní vľavo stojíte v radení pred križovatkou. Za vami sa vytvorila kolóna a protiidúce vozidlá majú voľno. Kedy môžete vojsť do križovatky?",["Až keď môžem odbočenie bezpečne dokončiť a neohrozím ani neobmedzím premávku podľa pravidiel; nesmiem zablokovať križovatku","Hneď po rozsvietení zelenej, aj keď zostanem stáť v križovatke","Keď vozidlo za mnou zatrúbi"],0,"Zelený signál nie je povolením vojsť do križovatky, ak by ste v nej pre prekážku alebo kolónu zostali stáť a blokovali premávku."],
 ["P","Vodič pred vami dáva znamenie vpravo, ale zaraďuje sa k pravému okraju a zjavne odbočuje až na ďalšej odbočke. Môžete ho predísť vpravo?",["Nie automaticky; musím sa presvedčiť o jeho skutočnom úmysle a dodržať pravidlá predchádzania a bezpečnosť","Áno, každé vozidlo so smerovkou vpravo možno predísť sprava","Áno, ak idem po chodníku alebo krajnici"],0,"Smerovka sama osebe neoprávňuje na predchádzanie sprava. Rozhoduje skutočný manéver, usporiadanie cesty a bezpečnosť."],
 ["P","Na priecestí sa po prejazde vlaku zdvihne závora, ale červené svetlá ešte blikajú. Čo urobíte?",["Počkám, kým výstražný signál úplne skončí a prejazd je dovolený","Prejdem, pretože závora sa už zdvihla","Prejdem, ak z druhej strany nevidím vlak"],0,"Rozhodujúci je aj svetelný výstražný signál. Kým červené svetlá blikajú, na priecestie sa nevchádza."],
 ["P","Pri jazde v tuneli sa pred vami vytvorí kolóna. Ako sa zachováte?",["Zachovám odstup, sledujem premenné signalizácie a nevykonávam cúvanie ani otáčanie","Zapnem diaľkové svetlá a prejdem na opačný pruh","Zastavím čo najbližšie za vozidlom predo mnou"],0,"V tuneli je dôležité zachovať odstup, rešpektovať signalizáciu a nevykonávať manévre, ktoré sú tam zakázané alebo nebezpečné."],
 ["P","Vozidlo pred vami zastaví pred priechodom pre chodcov. V susednom pruhu je voľno. Aký postup je správny?",["Zastavím tiež; vozidlo pred priechodom nesmiem obísť ani predísť spôsobom, ktorý by ohrozil chodca","Prejdem susedným pruhom, ak chodca zatiaľ nevidím","Zatrúbim a pomaly prejdem"],0,"Zastavené vozidlo pred priechodom môže zakrývať chodca. Predchádzanie takého vozidla je zakázané a nebezpečné."],
 ["P","Vodič pri cúvaní z parkovacieho miesta má obmedzený výhľad a okolo prechádzajú chodci. Čo musí urobiť?",["Cúvať len tak, aby nikoho neohrozil; ak nemá dostatočný výhľad, zabezpečí si pomoc alebo cúvanie preruší","Cúvať pomaly bez kontroly, pretože chodci musia počítať s vozidlom","Použiť klaksón a pokračovať"],0,"Pri cúvaní má vodič zvýšenú povinnosť opatrnosti. Ak nemá dostatočný výhľad, musí si zabezpečiť bezpečný postup."],
 ["R","Na križovatke bez značiek prichádzate súčasne s vozidlom sprava. Vy odbočujete vpravo, druhé vozidlo ide rovno. Kto má prednosť?",["Vozidlo prichádzajúce sprava; odbočenie vpravo vám samo osebe prednosť nedáva","Vy, pretože odbočujete vpravo","Vozidlo idúce rovno má vždy prednosť bez ohľadu na smer príchodu"],0,"Na križovatke rovnocenných ciest sa uplatňuje prednosť sprava. Smer odbočenia túto povinnosť neruší."],
 ["R","Na križovatke máte značku STOP, no cesta je na pohľad prázdna. Kde musíte zastaviť?",["Na mieste, odkiaľ máte náležitý rozhľad do križovatky; ak je čiara STOP, pred ňou","Len vtedy, keď sa približuje iné vozidlo","Až priamo v križovatke, aby ste lepšie videli"],0,"Značka STOP prikazuje zastaviť na príslušnom mieste pred križovatkou; prázdna cesta povinnosť zastaviť neruší."],
 ["R","Na križovatke riadenej policajtom ukazuje policajt pokyn, ktorý je v rozpore so svetelným signálom. Čím sa riadite?",["Pokynom policajta","Svetelným signálom, pretože je technicky nadradený","Značkou hlavnej cesty bez ohľadu na pokyn"],0,"Pokyny policajta oprávneného riadiť premávku sú nadradené svetelným signálom aj dopravným značkám upravujúcim prednosť."],
 ["R","Na križovatke so značkou Daj prednosť v jazde sa približujete k hlavnej ceste. Vozidlo na hlavnej ceste signalizuje odbočenie do vedľajšej ulice. Môžete vojsť?",["Až keď je zrejmé, že jeho smer jazdy a situácia umožňujú bezpečné vojsť; nespolieham sa iba na smerovku","Okamžite, pretože smerovka zaručuje, že odbočí","Vôbec nie, vozidlá na hlavnej majú prednosť aj po odbočení"],0,"Smerovka nie je zárukou vykonania manévru. Vodič na vedľajšej musí vyčkať, kým je zaradenie bezpečné a prednosť je reálne vyriešená."],
 ["S","Na križovatke bez semaforov stojíte na vedľajšej ceste. Vozidlo na hlavnej ceste spomalí a vodič vám rukou naznačí, aby ste vošli. Čo urobíte?",["Overím situáciu vo všetkých smeroch a vojdem len vtedy, keď je to bezpečné; gesto ma nezbavuje povinnosti dať prednosť","Vojdem bez kontroly, pretože gesto ruší značku Daj prednosť","Zostanem stáť vždy, aj keď je cesta bezpečne voľná"],0,"Gesto iného vodiča nie je náhradou za vlastné presvedčenie o bezpečnosti a povinnosť rešpektovať značky."],
 ["S","Pri odbočovaní vpravo na viacpruhovej ceste sa vedľa vás vpravo pohybuje cyklista rovno. Čo je rozhodujúce?",["Nesmiete mu skrížiť dráhu; musíte ho zaregistrovať a dať mu prednosť, ak pokračuje rovno po súbežnej trase","Máte prednosť, lebo motorové vozidlo je väčšie","Cyklista musí vždy zastaviť pred každým odbočujúcim autom"],0,"Pred odbočením kontrolujte pravú stranu a mŕtvy uhol. Pri križovaní dráhy cyklistu mu musíte dať prednosť podľa pravidiel."],
 ["S","Vchádzate na kruhový objazd s dvoma jazdnými pruhmi. Chcete vyjsť prvým výjazdom, ale nachádzate sa v ľavom pruhu. Ako postupujete?",["Zmením pruh len po kontrole a bezpečnom daní prednosti vozidlám v pravom pruhu; ak sa bezpečne zaradiť nedá, pokračujem a výjazd riešim neskôr","Prudko prejdem cez pravý pruh, pretože mám výjazd hneď pred sebou","Zastavím v kruhovom objazde a počkám na medzeru"],0,"Pri zmene jazdného pruhu v kruhovom objazde platia bežné pravidlá: smerovka, kontrola a prednosť vozidlám v pruhu, do ktorého sa zaraďujete."],
 ["S","Za zníženej viditeľnosti sa približujete k neosvetlenému vozidlu stojacemu čiastočne v jazdnom pruhu. Čo je najbezpečnejšie?",["Včas znížim rýchlosť, vyhodnotím protiidúcu premávku a prekážku obídem len s dostatočným bočným odstupom","Tesne ho obídem, aby som nezdržoval premávku","Prejdem do protismeru bez kontroly, pretože stojace vozidlo je prekážka"],0,"Prekážku obchádzajte až po kontrole protismeru a s dostatočným odstupom; pri nedostatku miesta zastavte."],
 ["S","Na mokrej vozovke sa pri brzdení aktivuje ABS a pedál pulzuje. Vozidlo stále smeruje k prekážke. Čo urobíte?",["Udržím silný tlak na brzdu a podľa možností riadim smer tak, aby som prekážku bezpečne obišiel","Uvoľním brzdu pri každom pulze a znovu ju stlačím","Zatiahnem parkovaciu brzdu"],0,"ABS umožňuje zachovať ovládateľnosť pri intenzívnom brzdení. Pedál sa nepumpuje; vodič sa sústredí aj na smerovanie vozidla."],
 ["S","Pri výjazde z parkoviska cúvate medzi zaparkovanými autami. Zbadáte dieťa, ktoré sa objaví za vozidlom. Čo je správne?",["Okamžite zastavím a pokračujem až po opätovnom overení priestoru","Zatrúbim a dokončím cúvanie","Pridám plyn, aby som priestor opustil skôr"],0,"Pri cúvaní musí vodič okamžite reagovať na chodcov a prekážky; dieťa môže zmeniť smer nepredvídateľne."],
 ["N","Ste prvý pri dopravnej nehode, pri ktorej je osoba zakliesnená vo vozidle a nereaguje. Čo urobíte ako prvé?",["Zabezpečím miesto nehody, privolám tiesňovú pomoc a postupujem podľa pokynov operátora; osobu nevyťahujem bez dôvodu bezprostredného ohrozenia","Okamžite ju vytiahnem za ruky bez ohľadu na poranenia","Najprv odfotím poškodené vozidlá pre poisťovňu"],0,"Miesto treba zabezpečiť a privolať pomoc. S poraneným nehýbte, ak mu nehrozí bezprostredné nebezpečenstvo alebo to nevyžaduje záchrana života."],
 ["N","Pri nehode je zranený v bezvedomí, ale normálne dýcha. Čo je správny postup po privolaní pomoci?",["Sledujem dýchanie, udržiavam priechodné dýchacie cesty a podľa okolností ho uložím do stabilizovanej polohy; chránim pred chladom","Podám mu vodu a posadím ho","Nechám ho samého, aby som riadil premávku"],0,"Pri bezvedomí s normálnym dýchaním je dôležité sledovať dýchanie a zabezpečiť priechodné dýchacie cesty; riaďte sa operátorom tiesňovej linky."],
 ["N","Po nehode sa z vozidla šíri zápach paliva a uniká kvapalina. Čo urobíte?",["Zabezpečím odstup, upozorním ostatných, zabránim zdrojom zapálenia a privolám hasičov alebo tiesňovú pomoc","Zapálim svetlicu pri vozidle, aby bolo lepšie viditeľné","Naštartujem vozidlo a odídem z miesta"],0,"Únik paliva predstavuje riziko požiaru. Nezapaľujte oheň, nemanipulujte so zdrojmi iskier a privolajte pomoc."],
 ["V","Vozidlo ide 72 km/h. Približne koľko metrov prejde za 1 sekundu reakčného času?",["20 metrov","10 metrov","36 metrov"],0,"72 km/h ÷ 3,6 = 20 m/s. Počas jednej sekundy reakcie prejde vozidlo približne 20 metrov ešte pred brzdením."],
 ["V","Pri rovnakej priľnavosti zvýšite rýchlosť z 60 na 90 km/h. Ako sa približne zmení brzdná dráha?",["Zväčší sa na 2,25-násobok","Zväčší sa na 1,5-násobok","Zväčší sa na trojnásobok"],0,"Brzdná dráha je približne úmerná štvorcu rýchlosti: (90/60)² = 2,25."],
 ["V","Prečo je pri plne naloženom vozidle potrebné prispôsobiť rýchlosť a odstup?",["Vyššia hmotnosť zvyšuje kinetickú energiu a môže predĺžiť brzdenie; mení sa aj správanie vozidla","Hmotnosť nemá vplyv na brzdenie, ak sú pneumatiky nové","Naložené vozidlo má vždy kratšiu brzdnú dráhu"],0,"Vyššia hmotnosť znamená väčšiu energiu, ktorú treba pri brzdení zvládnuť, a môže zmeniť stabilitu vozidla."],
 ["V","Čo je najvhodnejšie urobiť pred dlhým klesaním v horskom teréne?",["Zvoliť primerane nízky prevodový stupeň ešte pred klesaním a využívať brzdenie motorom","Zaradiť neutrál a brzdiť až podľa potreby","Vypnúť motor, aby sa neprehrial"],0,"Nižší prevodový stupeň pomáha brzdiť motorom a obmedzuje prehrievanie prevádzkových bŕzd."],
 ["V","Pri jazde s manuálnou prevodovkou sa blížite k prudkej zákrute na mokrej ceste. Kedy je vhodné podradiť?",["Pred zákrutou, plynulo a pri primeranej rýchlosti, nie prudko uprostred zákruty","Uprostred zákruty pri súčasnom prudkom brzdení","Až po strate priľnavosti kolies"],0,"Rýchlosť a prevodový stupeň upravte pred zákrutou; prudké zmeny zaťaženia v zákrute môžu vyvolať šmyk."],
 ["D","Vodič používa vozidlo, ktorého držiteľom je iná osoba. Ktoré tvrdenie o zodpovednosti vodiča je správne?",["Vodič zodpovedá za dodržiavanie pravidiel počas vedenia vozidla, aj keď nie je jeho vlastníkom","Za všetky priestupky zodpovedá výlučne vlastník vozidla","Vodič nemusí poznať doklady ani technický stav vozidla, ak mu ho požičali"],0,"To, že vodič nie je vlastníkom vozidla, ho nezbavuje povinností pri vedení vozidla."],
 ["D","Pred jazdou do zahraničia si chcete overiť, či môžete použiť vozidlo. Čo je rozumné skontrolovať?",["Platnosť vodičského oprávnenia, dokladov vozidla, poistenia a prípadné osobitné požiadavky cieľovej krajiny","Len stav paliva a navigáciu","Iba občiansky preukaz vodiča"],0,"Pred cestou treba skontrolovať platnosť oprávnenia, dokladov, poistenia a pravidlá krajiny, do ktorej cestujete."],
 ["O","Počas jazdy zistíte, že jedna pneumatika má viditeľnú vydutinu na bočnici. Čo urobíte?",["Bezpečne zastavím a pneumatiku nechám odborne vymeniť; s poškodenou bočnicou nepokračujem v bežnej jazde","Znížim tlak a pokračujem až do cieľa","Vydutina je kozmetická chyba, ak dezén nie je zjazdený"],0,"Vydutina môže znamenať poškodenú kostru pneumatiky a riziko náhleho defektu. Pneumatiku treba vymeniť."],
 ["O","Kedy je vhodné kontrolovať tlak v pneumatikách, ak chcete získať porovnateľnú hodnotu?",["Na studených pneumatikách podľa údajov výrobcu vozidla","Ihneď po rýchlej jazde po diaľnici","Len po vizuálnej kontrole dezénu"],0,"Tlak sa meria na studených pneumatikách a porovnáva s hodnotami uvedenými výrobcom vozidla."],
 ["O","Poškodené čelné sklo má prasklinu v zornom poli vodiča. Ako postupujete?",["Vozidlo nepoužijem, ak poškodenie obmedzuje výhľad alebo ohrozuje bezpečnosť; zabezpečím opravu","Pokračujem, ak stierače fungujú","Prasklinu prekryjem papierom"],0,"Výhľad vodiča nesmie byť obmedzený spôsobom, ktorý ohrozuje bezpečnosť cestnej premávky."],
 ["O","Pri kontrole zistíte, že na jednej náprave sú pneumatiky rozdielneho rozmeru, hoci výrobca takú kombináciu nepovoľuje. Čo platí?",["Vozidlo nie je v predpísanom technickom stave a treba použiť schválenú kombináciu","Je to dovolené, ak majú obe pneumatiky rovnaký dezén","Je to dovolené iba v meste"],0,"Pneumatiky musia zodpovedať schváleným rozmerom a požiadavkám výrobcu; nesprávna kombinácia môže ovplyvniť stabilitu."],
 ["B","Pri jazde za silného bočného vetra vychádzate z lesa na otvorený most. Ako upravíte jazdu?",["Znížim rýchlosť, pevne držím volant a počítam s náhlym bočným nárazom vetra","Zrýchlim, aby som most prešiel čo najrýchlejšie","Pustím volant na okamih, aby sa vozidlo samo vyrovnalo"],0,"Na otvorenom úseku môže bočný vietor náhle zmeniť smer pôsobenia; nižšia rýchlosť a pevné držanie volantu zvyšujú rezervu."],
 ["B","Vchádzate do zákruty a za vozidlom veziete ťažký náklad. Čo je najbezpečnejšie?",["Znížim rýchlosť pred zákrutou a vyhnem sa prudkému brzdeniu či zmene smeru v zákrute","Zabrzdím prudko až v strede zákruty","Naložené vozidlo drží cestu lepšie, preto môžem ísť rýchlejšie"],0,"Náklad mení hmotnosť a ťažisko vozidla. Rýchlosť znižujte pred zákrutou a náklad musí byť zabezpečený."],
 ["B","Pri jazde po diaľnici začne vozidlo aquaplanovať. Ktorý postup je najvhodnejší?",["Plynulo uberiem plyn, držím volant rovno a vyhnem sa prudkému brzdeniu či zatáčaniu, kým sa obnoví kontakt pneumatík","Prudko zabrzdím a otočím volantom k okraju","Zatiahnem parkovaciu brzdu"],0,"Pri aquaplaningu je potrebné minimalizovať prudké zásahy a počkať na obnovenie kontaktu pneumatík s vozovkou."],
 ["B","V noci idete za vozidlom, ktorého vodiča by vaše diaľkové svetlá oslňovali v spätných zrkadlách. Čo urobíte?",["Prepnem na stretávacie svetlá a dodržím bezpečný odstup","Nechám diaľkové svetlá, pretože svietia dopredu","Zapnem zadné hmlové svetlo"],0,"Diaľkové svetlá nesmú oslňovať ani vodiča pred vami. Pri približovaní k vozidlu ich treba prepnúť."],
 ["B","Na mokrej ceste sa blížite k priechodu, pri ktorom stojí skupina detí. Čo je najbezpečnejšie?",["Včas znížim rýchlosť, zvýšim pozornosť a pripravím sa zastaviť; počítam s nepredvídateľným pohybom detí","Zachovám rýchlosť, pretože deti ešte nevstúpili na priechod","Zatrúbim, aby deti zostali stáť"],0,"Deti môžu vstúpiť na vozovku náhle. Na mokrej ceste je navyše dlhšia brzdná dráha."],
 ["B","Pri dlhšej jazde začnete opakovane zívať a prehliadnete dopravnú značku. Čo je správne?",["Na bezpečnom mieste zastavím a oddýchnem si; káva ani otvorené okno nenahrádzajú spánok","Zvýšim hlasitosť rádia a pokračujem","Zrýchlim, aby som bol skôr v cieli"],0,"Zívanie a prehliadanie značiek sú príznaky únavy. Jediným spoľahlivým riešením je prestávka a odpočinok."],
 ["B","Vozidlo s ABS brzdí na štrku. Ktoré tvrdenie je najpresnejšie?",["ABS pomáha predchádzať zablokovaniu kolies a zachovať riaditeľnosť, ale nemusí vždy skrátiť brzdnú dráhu na každom povrchu","ABS zaručuje najkratšiu brzdnú dráhu na každom povrchu","S ABS sa na štrku nesmie brzdiť naplno"],0,"ABS pomáha zachovať ovládateľnosť, no na niektorých sypkých povrchoch môže byť brzdná dráha dlhšia než pri zablokovaných kolesách."],
 ["K","Po naštartovaní zostane svietiť červená kontrolka tlaku motorového oleja. Čo urobíte?",["Motor vypnem a zistím príčinu; nepokračujem v jazde, kým sa problém nevyrieši","Pridám plyn a počkám, či kontrolka zhasne","Pokračujem, ak motor zatiaľ nevydáva hluk"],0,"Nedostatočný tlak oleja môže rýchlo poškodiť motor. Červená kontrolka vyžaduje bezpečné zastavenie a vypnutie motora."],
 ["K","Počas jazdy sa rozsvieti červená kontrolka teploty chladiacej kvapaliny a teplomer ukazuje prehriatie. Čo je správne?",["Bezpečne zastavím, vypnem motor podľa pokynov výrobcu a neotváram horúci uzáver chladiacej sústavy","Pokračujem s kúrením vypnutým a vyššími otáčkami","Okamžite otvorím uzáver nádržky, aby unikla para"],0,"Pri prehriatí treba zastaviť a nechať motor vychladnúť. Horúca chladiaca sústava je pod tlakom."],
 ["K","Pri brzdení počujete kovové škrípanie a vozidlo brzdí citeľne slabšie. Čo urobíte?",["Bezpečne zastavím a zabezpečím kontrolu brzdovej sústavy; nepokračujem v bežnej jazde","Zvýšim rýchlosť, aby brzdy vyschli","Použijem iba parkovaciu brzdu a pokračujem"],0,"Neobvyklý zvuk spolu so zníženým účinkom môže znamenať vážnu poruchu bŕzd. Vozidlo treba odstaviť."],
 ["K","Po výmene akumulátora sa rozsvieti kontrolka dobíjania. Ktorá sústava je najpravdepodobnejšie potrebná na kontrolu?",["Nabíjacia sústava vrátane alternátora, remeňa, vedenia a spojov","Chladiaca sústava a termostat","Palivová nádrž a odvetranie"],0,"Kontrolka dobíjania upozorňuje na problém nabíjacej sústavy; príčinou nemusí byť samotný akumulátor."],
 ["K","Čo môže spôsobiť príliš nízka hladina brzdovej kvapaliny?",["Zníženie účinnosti alebo poruchu hydraulickej brzdovej sústavy; treba zistiť príčinu úbytku","Len vyššiu spotrebu paliva","Rýchlejšie nabíjanie akumulátora"],0,"Pokles hladiny môže súvisieť s opotrebovaním alebo únikom. Pri podozrení na poruchu bŕzd sa vozidlo nesmie používať."],
 ["K","Pri kontrole motorového oleja je hladina nad značkou MAX. Čo je správne?",["Upraviť hladinu na rozsah odporúčaný výrobcom, pretože nadmerné množstvo môže poškodiť motor alebo emisný systém","Ponechať ju, pretože viac oleja vždy lepšie maže","Odsiať všetok olej a jazdiť bez neho"],0,"Hladina oleja má byť v predpísanom rozsahu. Preplnenie môže spôsobiť poruchy a poškodenie."],
 ["K","Čo sa môže stať, ak sa do ostrekovačov v zime použije iba voda?",["Kvapalina môže zamrznúť, poškodiť systém a znemožniť čistenie skla","Zvýši sa tlak v pneumatikách","Zníži sa teplota motorového oleja"],0,"V zime treba použiť kvapalinu s bodom tuhnutia vhodným pre očakávané teploty."]

,
["P","Na úzkej obojsmernej ceste sa stretnú dve protiidúce vozidlá. Na vašej strane je prekážka, ktorá vám bráni pokračovať. Ako postupujete?",["Pokračujem, pretože prekážka je na mojej strane a protiidúce vozidlo musí cúvať","Dám prednosť protiidúcemu vozidlu, ak prekážka bráni v jazde mne; podľa situácie bezpečne zastavím pred zúžením","Mám prednosť, ak som už prednou časťou vozidla vošiel do zúženého úseku"],1,"Vodič, na ktorého strane je prekážka alebo zúženie, nesmie nútiť protiidúce vozidlo k nebezpečnému vyhýbaciemu manévru. Rozhodujúce je bezpečné a plynulé vyhnutie, nie to, kto je rýchlejší."],
["P","Pred vami ide vozidlo pomaly a vy ho chcete predísť. V protismere je vozidlo, ktoré je ešte pomerne ďaleko. Ktoré posúdenie je správne?",["Predbiehanie môžem začať, ak sa stihnem zaradiť tesne pred protiidúce vozidlo","Rozhodujúce je, či mám dostatočný rozhľad a voľný priestor na celý manéver vrátane bezpečného zaradenia bez ohrozenia protiidúcich","Stačí, ak pri začatí predchádzania nie je protiidúce vozidlo v mojom jazdnom pruhu"],1,"Pri predchádzaní treba posúdiť celý manéver, nie iba okamih vybočenia. Musí zostať dostatok priestoru na bezpečné dokončenie a zaradenie."],
["P","Na viacpruhovej ceste sa chcete zaradiť do vedľajšieho pruhu. V ňom ide vozidlo v oblasti vášho mŕtveho uhla. Čo platí?",["Smerovka mi dáva prednosť, ak ju zapnem dostatočne skoro","Môžem sa zaradiť, ak vozidlo v druhom pruhu mierne spomalí","Zmenu pruhu nevykonám, kým sa nepresvedčím, že tým neohrozím ani neobmedzím vozidlo v cieľovom pruhu; smerovka sama prednosť nezakladá"],2,"Znamenie o zmene smeru jazdy neudeľuje prednosť. Vodič sa musí presvedčiť, že môže bezpečne zmeniť pruh, a zohľadniť aj mŕtvy uhol."],
["P","Pri odbočovaní vpravo križujete cyklistickú infraštruktúru, po ktorej ide cyklista rovnakým smerom. Čo urobíte?",["Odbočím pred cyklistom, pretože som už na vozovke a dávam smerovku","Dám pozor na cyklistu a podľa pravidiel mu umožním bezpečný prejazd; odbočenie nesmiem vykonať tak, aby som mu skrížil dráhu a ohrozil ho","Cyklista musí vždy zastaviť, keď vozidlo signalizuje odbočenie"],1,"Pri odbočovaní treba venovať osobitnú pozornosť cyklistovi idúcemu súbežne a neskrížiť mu nebezpečne dráhu. Smerovka neznamená automatickú prednosť."],
["P","Blížite sa k priechodu, pred ktorým vozidlo v susednom pruhu zastavilo. Váš pruh je voľný. Aký postup je správny?",["Pokračujem nezmenenou rýchlosťou, pretože chodec ešte nemusí byť viditeľný","Znížim rýchlosť a pripravím sa zastaviť; nesmiem obísť stojace vozidlo spôsobom, ktorý by ohrozil chodca na priechode","Zastavím iba vtedy, keď chodec už stojí uprostred môjho jazdného pruhu"],1,"Zastavené vozidlo pred priechodom môže zakrývať chodca. Vodič musí zvýšiť opatrnosť a nesmie pokračovať tak, aby chodca ohrozil."],
["R","Na križovatke bez značiek prichádzate sprava k vozidlu, ktoré odbočuje vľavo a má vás po svojej pravej strane. Vy idete priamo. Kto má prednosť?",["Vozidlo odbočujúce vľavo, pretože už začalo odbočovací manéver","Vy, pretože pri rovnocennej križovatke sa uplatní prednosť sprava a odbočujúci vľavo navyše nesmie ohroziť protiidúce vozidlo","Prednosť má vozidlo, ktoré je bližšie k stredu križovatky"],1,"Na križovatke bez úpravy prednosti sa uplatňuje prednosť sprava. Pri odbočovaní vľavo platí aj povinnosť dať prednosť protiidúcim vozidlám."],
["R","Vchádzate na kruhový objazd, pred ktorým je značka Daj prednosť v jazde. Zľava sa približuje vozidlo, ktoré dáva smerovku vpravo. Čo urobíte?",["Vojdem, pretože jeho smerovka znamená, že určite opustí kruhový objazd pred mojím vjazdom","Vojdem iba vtedy, ak jeho skutočný pohyb a vzdialenosť umožňujú bezpečný vjazd; nespolieham sa výlučne na smerovku","Vždy čakám, kým kruhový objazd úplne opustia všetky vozidlá"],1,"Smerovka je iba znamenie o zamýšľanom manévri, nie záruka, že ho vodič skutočne vykoná. Vjazd musí byť bezpečný a v súlade so značkou Daj prednosť."],
["R","Policajt riadi križovatku pokynom, ktorý je v rozpore so svetelným signálom. Ako sa zachováte?",["Riadim sa svetelným signálom, pretože semafor je technické zariadenie","Riadim sa pokynom policajta, pretože jeho pokyny majú prednosť pred svetelnými signálmi a značkami upravujúcimi prednosť","Zastavím a čakám, kým sa pokyn policajta zosúladí so semaforom"],1,"Pokyny osoby oprávnenej riadiť premávku sú nadradené svetelným signálom a dopravným značkám."],
["R","Na križovatke svieti zelená, ale za križovatkou je kolóna a nemali by ste kam pokračovať. Čo je správne?",["Vojdem, pretože zelený signál povoľuje prejazd bez ďalšieho posudzovania","Nevchádzam do križovatky, ak by som v nej musel zostať stáť a blokovať priečny smer; počkám na priestor za križovatkou","Vojdem aspoň do jej stredu, aby vodiči za mnou mohli prejsť"],1,"Zelený signál nezbavuje vodiča povinnosti nevchádzať do križovatky, ak by v nej zostal stáť a znemožnil prejazd iným."],
["S","Prichádzate ku križovatke, kde je súčasne značka STOP a vodorovná čiara priečne cez váš jazdný pruh. Kde musíte zastaviť?",["Pri čiare; ak je čiara neprehľadná, zastavím ešte raz na mieste s potrebným rozhľadom pred vjazdom do križovatky","Až za čiarou, aby som mal lepší výhľad na priečnu cestu","Stačí výrazne spomaliť, ak z oboch strán nič nejde"],0,"Pri značke STOP treba zastaviť na mieste určenom čiarou. Ak odtiaľ nie je dostatočný rozhľad, vodič sa po prvom zastavení posunie a podľa potreby zastaví znova na mieste, odkiaľ má rozhľad."],
["S","Na železničnom priecestí začnú blikať červené svetlá, keď ste už tesne pred priecestím. Čo urobíte?",["Zrýchlim, ak vlak ešte nevidím","Zastavím pred priecestím; zákaz vjazdu platí aj vtedy, keď vlak ešte nie je viditeľný","Vojdem, ak sa závory ešte nezačali sklápať"],1,"Červené prerušované svetlá zakazujú vjazd na priecestie. Vodič nesmie rozhodovať podľa toho, či už vidí vlak alebo či sa závory pohybujú."],
["S","Po nehode je vozidlo poškodené, ale zostalo pojazdné. Nikto nie je zranený a účastníci sa vedia dohodnúť. Ktorý postup je najvhodnejší?",["Vždy musím volať políciu, aj keď ide iba o malú škodu a účastníci sa dohodli","Zabezpečím miesto, vymením si zákonom požadované údaje a vyplním a podpíšem záznam o nehode; políciu privolám, ak nastane zákonný dôvod alebo sa účastníci nedohodnú","Stačí odfotografovať evidenčné čísla a odísť, ak vozidlo možno odviezť"],1,"Pri škodovej udalosti bez zranenia a pri splnení zákonných podmienok účastníci zabezpečia miesto, vymenia si údaje a vyplnia záznam. Polícia sa volá pri zákonom stanovených dôvodoch, napríklad pri zranení alebo nedohode."],
["N","Ste prvý pri dopravnej nehode. Zranený človek nereaguje, ale normálne dýcha. Čo urobíte po zabezpečení vlastnej bezpečnosti a privolaní pomoci?",["Nechám ho sedieť alebo ležať v polohe, v akej som ho našiel, a pravidelne kontrolujem dýchanie; s človekom manipulujem len pri bezprostrednom nebezpečenstve alebo potrebe uvoľniť dýchacie cesty","Podám mu vodu a posadím ho, aby sa rýchlejšie prebral","Okamžite ho postavím na nohy, aby som zistil, či nemá poranenú chrbticu"],0,"Pri bezvedomí je zásadné kontrolovať dýchanie a zabezpečiť priechodnosť dýchacích ciest. Zbytočná manipulácia môže zhoršiť poranenie; ak nedýcha normálne, treba začať KPR podľa pokynov operátora."],
["N","Po nehode zranený človek nedýcha normálne a ste sami. Aký je správny postup?",["Najskôr ho niekoľko minút pozorujem, či sa dýchanie samo neobnoví","Volám tiesňovú linku alebo použijem hlasitý odposluch a začnem KPR podľa pokynov operátora; ak je dostupný AED, zabezpečím jeho použitie","Podám mu tekutiny a pokúsim sa ho posadiť"],1,"Pri nereagujúcom človeku, ktorý nedýcha normálne, treba okamžite privolať pomoc a začať resuscitáciu. Operátor tiesňovej linky môže poskytovať telefonické pokyny."],
["V","Pri rýchlosti 90 km/h reagujete približne za jednu sekundu. Akú vzdialenosť prejdete ešte pred začiatkom brzdenia a čo z toho vyplýva?",["Približne 9 metrov; pri tejto rýchlosti je reakčná dráha krátka a rozhodujúca je najmä kvalita pneumatík","Približne 25 metrov; vozidlo prejde túto vzdialenosť ešte počas reakcie, bez ohľadu na účinnosť bŕzd","Približne 40 metrov; reakčná dráha sa počíta až po úplné zastavenie"],1,"90 km/h je 25 metrov za sekundu. Reakčná dráha vzniká ešte pred tým, ako vodič začne brzdiť; k nej sa následne pripočíta brzdná dráha."],
["V","Na mokrej vozovke sa brzdná dráha pri rovnakej rýchlosti predĺži. Ktoré tvrdenie najlepšie vystihuje, prečo nemožno bezpečnú rýchlosť určiť iba podľa limitu?",["Dopravný limit je najvyššia povolená rýchlosť za vhodných podmienok; vodič musí ísť pomalšie, ak priľnavosť, dohľadnosť, stav vozidla alebo premávka vyžadujú väčšiu rezervu","Ak neprekročím limit, moja rýchlosť je automaticky bezpečná bez ohľadu na počasie","Na mokrej ceste sa mení iba reakčná dráha, nie brzdná dráha"],0,"Najvyššia dovolená rýchlosť nie je povinná cieľová rýchlosť. Vodič musí zohľadniť aktuálne podmienky a schopnosť zastaviť na bezpečnú vzdialenosť."],
["V","Vozidlo začne v zákrute strácať priľnavosť zadnej nápravy a zadná časť sa vychyľuje do strany. Ktoré tvrdenie je najbezpečnejšie?",["Ide o pretáčavý šmyk; prudké brzdenie a náhle pohyby volantom môžu situáciu zhoršiť, preto treba reagovať plynulo a podľa smeru šmyku vozidlo stabilizovať","Ide o nedotáčavý šmyk; treba ešte viac zatočiť do zákruty a prudko pridať plyn","Najistejšie je zatiahnuť parkovaciu brzdu, aby sa zadná náprava vyrovnala"],0,"Pri pretáčavosti stráca zadná náprava bočné vedenie a zadná časť sa stáča. Prudké zásahy môžu vyvolať ďalšiu stratu stability; dôležitá je plynulá korekcia a zníženie nárokov na pneumatiky."],
["V","Prečo je nebezpečné prejsť z hlbokého vyjazdeného koľajiska s vodou prudkým pohybom volantu?",["Pneumatiky môžu pri aquaplaningu znovu získať kontakt nerovnomerne a prudký zásah môže vyvolať náhlu zmenu smeru alebo šmyk","Voda v koľajisku znižuje iba výkon motora, preto je prudké zatočenie bezpečné","Prudký pohyb volantu vždy zvýši prítlak pneumatík na vozovku"],0,"Pri aquaplaningu môže byť kontakt pneumatík s vozovkou výrazne obmedzený. Prudké riadenie alebo brzdenie môže po obnovení priľnavosti spôsobiť nečakanú reakciu vozidla."],
["D","Vodič má pri sebe vodičský preukaz, ale počas jazdy zistí, že mu uplynula jeho platnosť. Ktoré tvrdenie je správne?",["Môže pokračovať, ak si pamätá číslo preukazu a oprávnenie mu nebolo odobraté","Samotné vlastníctvo neplatného dokladu nepreukazuje splnenie povinnosti mať platný doklad; musí postupovať podľa pravidiel preukazovania oprávnenia a nesmie ignorovať uplynutie platnosti","Platnosť dokladu sa automaticky predlžuje do najbližšej technickej kontroly vozidla"],1,"Treba rozlišovať existenciu vodičského oprávnenia a platnosť dokladu, ktorým sa preukazuje. Vodič má povinnosť mať požadované doklady v platnom stave podľa aktuálnych predpisov."],
["O","Počas jazdy sa rozsvieti kontrolka tlaku v pneumatikách, ale vozidlo sa zatiaľ správa normálne. Čo urobíte?",["Pokračujem rovnakou rýchlosťou až do cieľa, pretože kontrolka sa môže rozsvietiť omylom","Pri najbližšej bezpečnej možnosti spomalím a skontrolujem pneumatiky; pri známkach poškodenia alebo výraznej straty tlaku bezpečne zastavím a problém vyriešim","Okamžite prudko zabrzdím na mieste, kde sa kontrolka rozsvietila"],1,"Kontrolka môže signalizovať pokles tlaku alebo poruchu systému. Treba bezpečne skontrolovať stav; prudké brzdenie na nevhodnom mieste by vytvorilo ďalšie riziko."],
["O","Po výmene kolesa dotiahnete skrutky iba rukou a pokračujete po diaľnici. Ktoré tvrdenie je správne?",["Ručné dotiahnutie postačuje, ak skrutky pri montáži kládli odpor","Koleso musí byť upevnené predpísaným spôsobom a skrutky dotiahnuté správnym momentom podľa výrobcu; po výmene treba bezpečne overiť upevnenie","Skrutky sa dotiahnu až po prejdení približne 100 kilometrov"],1,"Nesprávne upevnené koleso predstavuje vážne bezpečnostné riziko. Používa sa predpísaný postup a uťahovací moment; následná kontrola sa vykoná podľa pokynov výrobcu."],
["K","Počas jazdy sa rozsvieti červená kontrolka brzdovej sústavy, hoci parkovacia brzda je úplne uvoľnená. Pedál brzdy je nezvyčajne mäkký. Čo je správne?",["Pokračujem pomaly, pretože mäkký pedál znamená len opotrebované pneumatiky","Bezpečne zastavím a vozidlo ďalej nepoužívam; môže ísť o závažnú poruchu hydraulickej brzdovej sústavy","Niekoľkokrát prudko zošliapnem pedál a pokračujem, ak sa jeho odpor dočasne obnoví"],1,"Kombinácia červenej kontrolky a zmeneného odporu pedála môže znamenať vážnu poruchu bŕzd. Dojazd do servisu vlastnou jazdou nie je bezpečný."],
["K","Motor sa po studenom štarte krátko správa hlučnejšie, ale kontrolky zhasnú a hluk po chvíli ustúpi. Ktorý prístup je najrozumnejší?",["Studený motor hneď zaťažím vysokými otáčkami, aby sa rýchlejšie zohrial","Motor nechám po štarte ustáliť a prvé kilometre jazdím s miernym zaťažením; pri pretrvávajúcom alebo nezvyčajnom hluku dám vozidlo skontrolovať","Vždy nechám motor bežať na mieste aspoň 20 minút bez ohľadu na pokyny výrobcu"],1,"Studený motor a mazivo ešte nemusia dosahovať prevádzkové podmienky. Primerané zaťaženie a dodržiavanie pokynov výrobcu znižujú opotrebenie; nezvyčajné trvalé zvuky treba preveriť."],
["B","Na mokrej ceste idete za nákladným vozidlom, ktoré rozstrekuje vodu a výrazne obmedzuje výhľad. Aký postup je najvhodnejší?",["Znížim rýchlosť, zväčším odstup a predídem ho iba vtedy, ak mám dostatočný rozhľad a bezpečný priestor na celý manéver","Priblížim sa tesne zaň, aby som využil jeho závetrie a znížil množstvo vody na čelnom skle","Zapnem diaľkové svetlá a začnem predchádzať, aby som čo najskôr získal výhľad"],0,"Voda z nákladného vozidla zhoršuje výhľad a mokrá vozovka predlžuje brzdenie. Väčší odstup zvyšuje čas na reakciu; predchádzanie je prípustné len pri bezpečnom rozhľade a priestore."],
["B","Vozidlo pred vami náhle zabrzdí. Máte ABS a vozidlo je vybavené stabilizačným systémom. Ktorý spôsob núdzového brzdenia je správny?",["Brzdím silno a súvisle, držím smer a podľa potreby bezpečne riadim; nepumpujem brzdový pedál, ak systém funguje správne","Brzdu opakovane rýchlo stláčam a uvoľňujem, aby ABS mohlo pracovať v intervaloch","Najprv zatiahnem parkovaciu brzdu a až potom stlačím prevádzkovú brzdu"],0,"Pri ABS sa pri núdzovom brzdení používa silný súvislý tlak na brzdový pedál. Pulzovanie pedála je bežná činnosť systému, nie pokyn vodičovi pumpovať."],
["B","Pri jazde z kopca v dlhom klesaní cítite zápach prehriatych bŕzd. Čo ste mali urobiť a čo teraz?",["Pred klesaním zvoliť vhodný nižší prevodový stupeň a brzdiť motorom; teraz bezpečne zastaviť na vhodnom mieste a nechať brzdy vychladnúť","Zaradiť neutrál a držať brzdový pedál stlačený počas celého klesania","Pokračovať vyššou rýchlosťou, pretože prúdenie vzduchu brzdy okamžite ochladí"],0,"Dlhodobé intenzívne brzdenie môže viesť k prehriatiu a poklesu účinku bŕzd. Brzdenie motorom znižuje zaťaženie prevádzkovej brzdovej sústavy."],
["B","Za zníženej viditeľnosti sa približujete k protiidúcemu vozidlu a zároveň idete za iným vozidlom. Kedy musíte prepnúť diaľkové svetlá na stretávacie?",["Len pri stretnutí s protiidúcim vozidlom; vodič pred vami nemôže byť diaľkovými svetlami oslnený","Aj vtedy, keď by diaľkové svetlá oslňovali vodiča pred vami cez spätné zrkadlá, a tiež pri stretnutí s protiidúcim vozidlom","Až keď protiidúci vodič blikne, pretože dovtedy sa oslnenie nepovažuje za problém"],1,"Diaľkové svetlá sa používajú len tak, aby neoslňovali ostatných účastníkov premávky, vrátane vodičov idúcich pred vami."],
["B","Vozidlo s prívesom sa pri vyššej rýchlosti začne rozkývavať do strán. Čo je najvhodnejšia reakcia?",["Plynulo uberiem plyn, vyhnem sa prudkému brzdeniu a pohybom volantu a nechám súpravu stabilizovať; po zastavení preverím naloženie a upevnenie nákladu","Prudko zatočím proti smeru kývania a súčasne zatiahnem parkovaciu brzdu","Zrýchlim, aby sa príves napol a prestal sa kývať"],0,"Rozkývanie prívesu môže súvisieť s rýchlosťou, rozložením nákladu alebo tlakom pneumatík. Prudké zásahy môžu rozkývanie zosilniť; treba plynulo znížiť rýchlosť a príčinu odstrániť."],
["P","Na ceste s dvoma jazdnými pruhmi v jednom smere sa pravý pruh končí. Vodič v končiacom pruhu chce pokračovať až k miestu zúženia. Ako sa uplatňuje pravidlo striedavého radenia?",["Vodiči sa musia zaradiť čo najskôr už pri prvej informácii o zúžení; jazda až k miestu zúženia je vždy zakázaná","Pri súbežnej jazde sa vozidlá z priebežného a končiaceho pruhu zaraďujú striedavo v mieste, kde sa pruh končí, pri zachovaní bezpečnosti","Vodiči v priebežnom pruhu majú vždy prednosť a nemusia umožniť striedavé zaradenie"],1,"Pri zbiehaní jazdných pruhov sa uplatňuje pravidlo striedavého radenia v mieste zúženia, ak sú splnené podmienky súbežnej jazdy. Nejde o oprávnenie vynucovať si zaradenie."],
["S","Na križovatke riadenej semaforom svieti zelená šípka vpravo, ale súčasne svieti červený kruhový signál. Ako sa zachováte?",["Zelená šípka umožňuje jazdu v smere šípky, pričom musím rešpektovať prípadnú povinnosť dať prednosť účastníkom, ktorých dráhu križujem","Červený kruhový signál vždy zakazuje jazdu aj pri súčasne svietiacej zelenej šípke","Zelená šípka mi dáva absolútnu prednosť pred chodcami aj vozidlami"],0,"Zelená smerová šípka povoľuje jazdu v označenom smere, no vodič musí rešpektovať pravidlá prednosti a nesmie ohroziť účastníkov, ktorých dráhu križuje."],
["N","Po nehode je motocyklista pri vedomí, sťažuje sa na bolesť krku a má nasadenú prilbu. Čo je správne?",["Prilbu mu okamžite zložím, aby sa mu ľahšie dýchalo, aj keď dýcha normálne","Zbytočne s ním nehýbem, stabilizujem situáciu, privolám odbornú pomoc a prilbu neskladám, pokiaľ to nie je nevyhnutné na zabezpečenie dýchania alebo podľa pokynov záchranárov","Pomôžem mu postaviť sa a odísť z vozovky bez ohľadu na bolesť krku"],1,"Pri podozrení na poranenie chrbtice sa s postihnutým zbytočne nehýbe. Manipulácia s prilbou môže zhoršiť poranenie; prioritou je bezpečnosť a dýchanie."],
["D","Vodič skupiny B získal oprávnenie ako 17-ročný. Ktoré tvrdenie o jazde pred dovŕšením 18 rokov je správne?",["Môže jazdiť samostatne, ak má pri sebe súhlas zákonného zástupcu","Môže viesť vozidlo len za zákonných podmienok so zapísanou sprevádzajúcou osobou, ktorá spĺňa požadovanú dĺžku držby skupiny B","Môže jazdiť s ktorýmkoľvek dospelým, ktorý má vodičský preukaz aspoň jeden rok"],1,"Pri udelení skupiny B pred 18. rokom platí osobitný režim sprevádzajúcej osoby podľa zákona; nestačí všeobecný súhlas rodiča ani ľubovoľný dospelý vodič."],
["O","Pri kontrole zistíte, že dezén pneumatiky je na jednom mieste výrazne viac opotrebovaný než inde. Čo z toho môže vyplývať?",["Môže ísť o nesprávny tlak, geometriu alebo poruchu zavesenia; samotné dofúkanie bez zistenia príčiny nemusí problém vyriešiť","Nerovnomerné opotrebovanie je bežné a nemá vplyv na bezpečnosť, ak je inde dezén hlboký","Stačí vymeniť predné a zadné kolesá bez kontroly smeru otáčania a rozmerov"],0,"Nerovnomerné opotrebovanie môže signalizovať technický problém. Treba skontrolovať tlak, geometriu a podvozok, nielen posúdiť najhlbšiu časť dezénu."],
["K","Po naštartovaní sa rozsvieti kontrolka motora a začne blikať, motor zároveň stráca výkon a trasie sa. Ako postupujete?",["Pokračujem vysokými otáčkami, aby sa motor vyčistil","Znížim zaťaženie, bezpečne zastavím a postupujem podľa pokynov výrobcu alebo zabezpečím servis; blikajúca kontrolka môže signalizovať závažnú poruchu spaľovania","Vypnem a znovu zapnem svetlá, pretože kontrolka súvisí s elektrickou sústavou"],1,"Blikajúca kontrolka motora spolu s nepravidelným chodom môže signalizovať poruchu, ktorá poškodzuje katalyzátor alebo motor. Nepokračujte v zaťažovaní vozidla."],

["V","Prečo je pri jazde s plne naloženým vozidlom potrebné upraviť tlak v pneumatikách podľa pokynov výrobcu?",["Zaťaženie mení deformáciu pneumatík a ich zahrievanie; nesprávny tlak môže zhoršiť stabilitu, brzdenie a zvýšiť riziko poškodenia","Vyšší tlak vždy znižuje priľnavosť, preto sa pri naložení musí tlak znížiť","Tlak sa mení iba podľa vonkajšej teploty, nie podľa zaťaženia vozidla"],0,"Výrobca uvádza tlak podľa zaťaženia a prevádzkových podmienok. Nesprávny tlak ovplyvňuje kontaktnú plochu, teplotu a jazdné vlastnosti."],
["P","Pri prejazde okolo cyklistu mimo obce máte dostatok priestoru na predchádzanie, no z protismeru sa približuje vozidlo. Čo je správne?",["Začnem predchádzať, ak cyklista ide pri krajnici a ja sa zmestím vedľa neho bez prekročenia stredovej čiary","Počkám, kým budem môcť dodržať bezpečný bočný odstup a vykonať celý manéver bez ohrozenia cyklistu ani protiidúceho vozidla","Zatrúbim a predídem cyklistu, pretože cyklista musí uvoľniť priestor"],1,"Predchádzanie cyklistu vyžaduje bezpečný bočný odstup a dostatok priestoru na celý manéver. Ak podmienky nie sú splnené, vodič musí počkať."],
["B","V noci vás oslepujú svetlá protiidúceho vozidla. Ktorý postup pomáha znížiť riziko, že stratíte kontrolu nad smerom jazdy?",["Pozerám priamo do svetiel, aby som odhadol ich intenzitu, a držím pôvodnú rýchlosť","Spomalím, nepozerám priamo do svetiel, orientujem sa podľa pravého okraja vozovky a podľa potreby bezpečne zastavím","Zavriem jedno oko a zrýchlim, aby oslepenie trvalo kratšie"],1,"Pri oslnení treba znížiť rýchlosť, vyhnúť sa priamemu pohľadu do svetiel a udržať orientáciu podľa okraja vozovky. Ak nevidíte bezpečne, zastavte."],
["S","Pri odbočovaní z vedľajšej cesty na hlavnú je rozhľad zakrytý zaparkovanými vozidlami. Ktorý postup je správny?",["Vojdem pomaly až do polovice hlavnej cesty a až potom sa rozhliadnem","Zastavím na vhodnom mieste, odkiaľ môžem bezpečne posúdiť premávku; ak treba, opatrne sa posuniem len tak, aby som neohrozil vozidlá na hlavnej ceste","Použijem zvukové výstražné znamenie a vojdem, ak nikto nezatrúbi"],1,"Vodič musí mať pred vjazdom dostatočný rozhľad a nesmie ohroziť vozidlá na hlavnej ceste. Posúvanie sa vykonáva opatrne a bez zasahovania do ich dráhy."],
["N","Pri nehode uniká z poškodeného vozidla palivo a v blízkosti sú ďalší účastníci. Čo má prednosť?",["Najskôr odfotografujem miesto a evidenčné čísla, aby sa zachovali dôkazy","Zabezpečím vlastnú bezpečnosť, upozorním ostatných na nebezpečenstvo, vzdialim osoby od zdroja rizika a privolám tiesňové zložky","Pokúsim sa unikajúce palivo zastaviť holými rukami a až potom zavolám pomoc"],1,"Pri úniku paliva hrozí požiar alebo výbuch. Prioritou je bezpečná vzdialenosť, varovanie osôb a privolanie záchranných zložiek; nemanipulujte s rizikovým miestom bez vybavenia."],
["V","Pri rýchlosti 50 km/h a reakčnom čase približne jednej sekundy prejdete pred začiatkom brzdenia asi 14 metrov. Čo sa stane s reakčnou dráhou, ak sa rýchlosť zvýši na 100 km/h a reakčný čas zostane rovnaký?",["Zostane približne 14 metrov, pretože reakčný čas sa nemení","Približne sa zdvojnásobí na 28 metrov, pretože za rovnaký čas prejdete dvojnásobnú vzdialenosť","Zvýši sa približne štvornásobne, rovnako ako brzdná dráha"],1,"Reakčná dráha rastie priamo úmerne rýchlosti. Pri dvojnásobnej rýchlosti a rovnakom reakčnom čase sa zdvojnásobí; brzdná dráha rastie približne so štvorcom rýchlosti."],
["P","V kolóne na diaľnici sa premávka náhle zastaví. Ako vytvoríte záchranársku uličku na dvojpruhovej vozovke?",["Vozidlá v ľavom pruhu sa posunú čo najviac doľava a vozidlá v pravom pruhu čo najviac doprava, pričom sa ulička vytvára medzi pruhmi","Všetky vozidlá sa presunú na pravú krajnicu a ľavý pruh zostane voľný","Ulička sa vytvorí medzi pravým jazdným pruhom a krajnicou"],0,"Na dvojpruhovej vozovke sa záchranárska ulička vytvára medzi ľavým a pravým pruhom: ľavý pruh uhýba doľava, pravý doprava."],
["B","Na diaľnici sa vám pri vysokej rýchlosti náhle roztrhne predná pneumatika. Ktorá reakcia je najvhodnejšia?",["Pevne držím volant, plynulo uberám plyn, vyhýbam sa prudkému brzdeniu a po spomalení bezpečne prejdem na vhodné miesto","Okamžite prudko stlačím brzdu a strhnem volant na krajnicu","Zatiahnem parkovaciu brzdu, aby sa vozidlo rýchlo zastavilo"],0,"Pri náhlom poškodení pneumatiky je dôležité udržať smer, vyhnúť sa prudkým zásahom a kontrolovane spomaliť. Až po získaní kontroly bezpečne odstavte vozidlo."]

function saveEndDate(){
 const el=$("#endDate"),msg=$("#dateMsg");if(!el||!msg)return;
 const m=el.value.trim().match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);

 const day=Number(m[1]),month=Number(m[2]),year=Number(m[3]),d=new Date(year,month-1,day);
 if(d.getFullYear()!==year||d.getMonth()!==month-1||d.getDate()!==day){msg.textContent="Tento dátum neexistuje. Skontroluj deň a mesiac.";msg.style.color="var(--bad)";return}
 const iso=year+"-"+String(month).padStart(2,"0")+"-"+String(day).padStart(2,"0");
 if(iso<"2026-11-23"){msg.textContent="Dátum ukončenia nemôže byť pred začiatkom kurzu (23.11.2026).";msg.style.color="var(--bad)";return}
 try{localStorage.setItem("vt_end",iso)}catch(e){msg.textContent="Dátum sa nepodarilo uložiť v tomto prehliadači.";msg.style.color="var(--bad)";return}
 home();
}

function learn(){
 const L=[["Ako vyzerá skúška","40 náhodných otázok, 30 minút, každá otázka má tri odpovede a len jedna je správna. Spolu je 100 bodov, na úspech treba aspoň 90. Váha otázok: situácie 4 body, pravidlá, prednosť a bezpečná jazda po 3 body, značky, nehoda a teória po 2 body, doklady, prevádzka a údržba po 1 bod."],
 ["Kľúčové čísla","V obci 50 km/h · mimo obce 90 km/h · diaľnica 130 km/h · obytná zóna 20 km/h (ak značka nestanovuje inak). Alkohol 0,0 ‰. Svetlá celoročne aj cez deň."],
 ["Skupina B od 17 rokov","Minimálny vek na udelenie vodičského oprávnenia skupiny B je 17 rokov. Ak je oprávnenie udelené pred 18. narodeninami, do 18 rokov (najmenej však tri mesiace) môže vodič jazdiť len so zapísanou sprevádzajúcou osobou, ktorá má skupinu B najmenej 10 rokov. Zákon č. 8/2009 Z. z., § 74 ods. 2 a § 78 ods. 1 písm. c)."],
 ["Prednosť v jazde","Poradie dôležitosti: pokyn policajta, svetelné signály, dopravné značky, všeobecné pravidlá. Rovnocenná križovatka: prednosť zprava. Odbáčajúci vľavo dáva prednosť protiidúcemu (priamo a vpravo) aj chodcom. Vozidlá so zvláštnym znamením majú prednosť vždy."],
 ["Zastavovacia dráha","Zastavovacia dráha = dráha reakcie (asi 1 sekunda jazdy) + brzdná dráha. 50 km/h je 14 m/s, 90 km/h 25 m/s, 130 km/h 36 m/s. Pri dvojnásobnej rýchlosti je brzdná dráha asi štvornásobná. Odstup aspoň 2 sekundy."],
 ["Skupiny značiek","Výstražné: červený trojuholník. Zákazové: červený kruh. Prikazové: modrý kruh. Informatívne: modrý štvorec. Prednosť: obrátený trojuholník, osemuholník STOP, žltý kosoštvorec."],
 ["Vozidlo","Červená = nebezpečenstvo (zastaviť), oranžová = porucha alebo upozornenie, zelená a modrá = informácia. Dezén 1,6 mm letné, 3 mm zimné pneumatiky. Prvá technická aj emisná kontrola do 4 rokov, potom každé 2 roky."],
 ["Núdzové situácie","Tiesňová linka EÚ 112 · záchranka 155 · polícia 158 · hasiči 150. KPR: 30 stlačení : 2 vdychy, 100 až 120 stlačení za minútu."]];
 paint(L.map(x=>`<div class="c"><h2>${x[0]}</h2><p style="margin:0">${x[1]}</p></div>`).join("")+`<div class="c"><h2>Kontrolky na prístrojovej doske</h2><p class="mu">Červená = zastaviť, oranžová = upozornenie, zelená a modrá = informácia.</p></div><div class="grid">${LP.map((_,i)=>lampCard(i)).join("")}</div><div class="c" style="margin-top:12px"><h2>Motorový priestor (schéma)</h2><div class="qs by">${baySvg(-1,1)}</div><ol style="padding-left:20px;margin:8px 0">${BY.map(b=>`<li><b>${b[0]}</b><div class="mu">${b[5]}</div></li>`).join("")}</ol><p class="mu">Schéma je zjednodušená; v skutočnom aute je rozloženie iné.</p></div><div class="c mu">Ide o stručné poznámky. Predpisy sa menia, over si ich v materiáloch autoškoly.</div>`)}
function test(){paint(`<div class="c"><h2>Spustiť test</h2><p class="mu">Otázky obsahujú viac-krokové situácie, podobné právne možnosti a odpovede s dôležitými výnimkami. Čítaj celé znenie: často rozhoduje jediný detail. Poradie otázok aj odpovedí sa pri každom teste náhodne mení. Tréningová databáza nie je oficiálnou databázou MV SR.</p><button class="btn f" onclick="start('exam')">Skúšobný test (40 otázok, 30 min)</button><button class="btn g f" onclick="start('mix',20)">Rýchly test (20)</button><button class="btn g f" onclick="start('mix',30)">Stredný test (30)</button><button class="btn g f" onclick="start('sit',15)">Križovatky a prednosť (15)</button><button class="btn g f" onclick="start('veh',20)">Kontrolky a motor (20)</button><button class="btn g f" onclick="start('signs',20)">Len značky (20)</button><button class="btn g f" onclick="start('text',20)">Len otázky (20)</button></div>`)}
function start(md,n){const it=mk(md,n);if(!it||!it.length){alert("Pre tento test sa nepodarilo pripraviť otázky. Skús inú kategóriu.");return}T={it,i:0,ans:[],md,end:Date.now()+30*60*1000};go("test");$("#nav").innerHTML="";if(md=="exam"){tm=setInterval(tick,1000);tick()}ask()}
function tick(){const l=T.end-Date.now();if(l<=0){clearInterval(tm);fin();return}$("#tm").textContent="Čas "+Math.floor(l/6e4)+":"+String(Math.floor(l/1e3)%60).padStart(2,"0")}
function quit(){if(confirm("Ukončiť test bez uloženia?")){T=null;go("home")}}
function ask(){
 const q=T.it[T.i],pc=Math.round(T.i/T.it.length*100);
 paint(`<div class="c"><div class="bar"><i id="pb" style="width:${pc}%"></i></div><div class="row mu" style="margin-top:8px"><span>Otázka ${T.i+1} / ${T.it.length} · <span class="tag">${C[q.c][0]}</span></span><span>${q.p} ${pl(q.p)}</span></div>${imh(q)}<h3>${q.q}</h3>${q.o.map((o,j)=>`<button class="opt" onclick="pick(${j})">${o}</button>`).join("")}<div id="fb"></div><button class="btn g" style="margin-top:14px" onclick="quit()">Ukončiť test</button></div>`);
 requestAnimationFrame(()=>{$("#pb").style.width=Math.round((T.i+1)/T.it.length*100)+"%"})}
function pick(j){
 const q=T.it[T.i];if(T.ans[T.i]!==undefined)return;T.ans[T.i]=j;
 document.querySelectorAll(".opt").forEach((b,x)=>{b.disabled=true;if(x==q.a)b.classList.add("ok");else if(x==j)b.classList.add("bad")});
 if(j!=q.a&&navigator.vibrate)navigator.vibrate(40);
 $("#fb").innerHTML=`<div class="fb"><p><b>${j==q.a?"✓ Správne.":"✗ Nesprávne."}</b> <span class="mu">${q.w}</span></p><button class="btn f" onclick="nx()">${T.i+1<T.it.length?"Ďalej":"Zobraziť výsledky"}</button></div>`;
 $("#fb").scrollIntoView({behavior:"smooth",block:"nearest"})}
function nx(){T.i++;T.i<T.it.length?ask():fin()}
const rv=(q,i,g)=>`<div class="c rv ${g===q.a?"okc":"nok"}"><div class="mu">${i+1}. <span class="tag">${C[q.c][0]}</span> · ${q.p} ${pl(q.p)}</div>${imh(q)}<h3>${q.q}</h3>${q.o.map((o,j)=>`<div class="ro ${j==q.a?"ok":j==g?"bad":""}">${j==q.a?"✓ ":j==g?"✗ ":""}${o}</div>`).join("")}${g===undefined?`<div class="mu">Bez odpovede</div>`:""}<div class="mu" style="margin-top:6px">${q.w}</div></div>`;
function fin(){
 clearInterval(tm);const it=T.it,sc=it.reduce((s,q,i)=>s+(T.ans[i]===q.a?q.p:0),0),mx=it.reduce((s,q)=>s+q.p,0);
 const rec={t:Date.now(),m:ML[T.md],sc,mx,items:it.map((q,i)=>({c:q.c,p:q.p,q:q.q,o:q.o,a:q.a,w:q.w,im:q.im,g:T.ans[i]===undefined?-1:T.ans[i]}))};
 const h=ld();h.push(rec);sv(h);T=null;go("hist");det(h.length-1,1)}
function det(i,fresh){
 const h=ld(),r=h[i];if(!r){go("hist");return}
 const pc=Math.round(r.sc/r.mx*100),ok=pc>=90,col=ok?"var(--ok)":"var(--bad)",by={};
 r.items.forEach(q=>{const k=C[q.c][0];by[k]=by[k]||[0,0];by[k][1]+=q.p;if(q.g===q.a)by[k][0]+=q.p});
 const wr=r.items.filter(q=>q.g!==q.a).length;
 paint(`<div class="c" style="text-align:center"><button class="btn g" style="float:left" onclick="go('hist')">‹ Späť</button><div style="clear:both"></div><svg class="ring" width="150" height="150" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--bd)" stroke-width="10"/><circle id="rg" cx="60" cy="60" r="52" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="327" stroke-dashoffset="327" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle" font-size="26" font-weight="800" fill="var(--tx)" id="cn">0</text></svg>
 <h2 style="margin-top:8px">${r.sc} / ${r.mx} ${pl(r.mx)} · ${pc} %</h2><span class="badge ${ok?"p":"n"}">${ok?"Prospel":"Neprospel"}</span><p class="mu">${r.m} · ${new Date(r.t).toLocaleString("sk-SK",{day:"numeric",month:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"})}<br>Na úspech treba aspoň 90 %.</p></div>
 <div class="c"><h2>Podľa tém</h2>${Object.entries(by).map(([c,v])=>`<div style="margin:8px 0"><div class="row"><span>${c}</span><b>${v[0]}/${v[1]}</b></div><div class="bar"><i data-w="${v[0]/v[1]*100}"></i></div></div>`).join("")}</div>
 <div class="c"><div class="chips" style="padding:0"><button class="chip on" onclick="fl(this,1)">Chyby (${wr})</button><button class="chip" onclick="fl(this,0)">Všetky otázky (${r.items.length})</button></div></div><div id="rl"></div>
 <button class="btn f" onclick="go('test')">Nový test</button>`);
 window.cur=r;fl(null,1);
 setTimeout(()=>{$("#rg").style.strokeDashoffset=327*(1-pc/100);document.querySelectorAll(".bar i[data-w]").forEach(b=>b.style.width=b.dataset.w+"%");const t0=performance.now(),el=$("#cn");(function f(n){const k=Math.min(1,(n-t0)/1200);el.textContent=Math.round(pc*(1-Math.pow(1-k,3)))+" %";if(k<1)requestAnimationFrame(f)})(t0)},fresh?250:80)}
function fl(b,only){if(b)document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x==b));
 const l=cur.items.map((q,i)=>[q,i]).filter(x=>!only||x[0].g!==x[0].a);
 $("#rl").innerHTML=l.length?l.map(([q,i])=>rv(q,i,q.g<0?undefined:q.g)).join(""):`<div class="c">Žiadne chyby.</div>`;
 $("#rl").querySelectorAll(".c").forEach((e,i)=>e.style.cssText+=`animation:up .4s both;animation-delay:${Math.min(i,8)*40}ms`)}
function hist(){
 const h=ld();
 paint(`<div class="c"><h2>História testov</h2><p class="mu">Klepni na test a uvidíš, čo si urobil zle.</p></div>`+(h.length?[...h.keys()].reverse().map(i=>{const r=h[i],pc=Math.round(r.sc/r.mx*100),ok=pc>=90;return`<div class="c hi" onclick="go('det',${i})"><div class="row"><b>${r.m}</b><span class="badge ${ok?"p":"n"}">${ok?"Prospel":"Neprospel"}</span></div><div class="row mu"><span>${new Date(r.t).toLocaleString("sk-SK",{day:"numeric",month:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"})}</span><span><b>${r.sc}/${r.mx}</b> · ${pc} % · chýb: ${r.items.filter(q=>q.g!==q.a).length}</span></div></div>`}).join("")+`<button class="btn g f" onclick="if(confirm('Vymazať celú históriu?')){sv([]);hist()}">Vymazať históriu</button>`:`<div class="c mu">Zatiaľ si neabsolvoval žiadny test.</div>`))}
go("home");
</script></body></html>
